<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CharacterEntity</title>
</head>

<body>
    <!-- Character set  -->
    <!-- Special character which is not present in the keyboard is called as chaarcter entity -->


    <h1 title="Hyper text markup language">HTML</h1>
    <h1 title="Cascading style sheet">CSS</h1>
    <h1 title="JavaScript">Js</h1>
    <!-- title attribute is used to display title name of the HTML elements -->
    <h1 title="Character  entity">CharacterEntity</h1>
    <h2>&copy;</h2>
    <h2>&trade;</h2>
    <h2>
        &alpha;
        &beta;
        &theta;
        &nbsp;<!-- non breakable space    -->
        &gamma;
        &reg;
    </h2>
    <abbr title="Hyper">HTML</abbr>6rdxx

    <!-- 1.Marque tag  is used to scroll the content from one end to another end
         2.default direction of marque tage is lsft
         3.to change the direction we are using attribute
         4.eg direction="left(default)/right/up/down" 
         5.to increate the height we are using height attribute   -->
    <marquee>HTML</marquee>
    <marquee direction="right" style="color: brown; background-color: chartreuse;">HTML</marquee>
    <marquee direction="up" style="color: cornflowerblue ; 
    background-color:black ;
    align-items:stretch;">HTML</marquee>
    <marquee direction="up" height="200" style="background-color: blueviolet;">HTML with 200 pixel height</marquee>
    <marquee direction="down" height="200">HTML with 200 pixel height</marquee>
</body>

</html>
